services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    labels:
      vibe.name: "dimensionamento-de-linha"
      vibe.expose: "true"
      vibe.auth.admins: "vsuriani@tractian.com"
      vibe.auth.policy: "restricted"
      vibe.description: "Planejamento de capacidade e dimensionamento de linha de produção (PCP)"
      vibe.team: "operacoes"
      vibe.tags: "pcp,planejamento,producao"
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      # Obrigatório: o volume em bloco traz lost+found e o Postgres não inicializa na raiz.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
